<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quantity Measurement</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<!-- Header -->
<div class="header">
  <h2>Quantity Measurement</h2>
  <span>History</span>
</div>

<!-- Banner -->
<div class="banner">
  Welcome To Quantity Measurement
</div>

<!-- Main -->
<div class="container">

  <p class="title">CHOOSE TYPE</p>

  <!-- Type Cards -->
  <div class="types">
    <div class="type active" data-type="length">Length</div>
    <div class="type" data-type="temperature">Temperature</div>
    <div class="type" data-type="volume">Volume</div>
  </div>

  <!-- Converter -->
  <div class="converter">

    <div class="box">
      <label>FROM</label>
      <input type="number" id="value">
      <select id="fromUnit"></select>
    </div>

    <div class="box">
      <label>TO</label>
      <input type="number" id="result" disabled>
      <select id="toUnit"></select>
    </div>

  </div>

</div>

<script src="js/dashboard.js"></script>
</body>
</html>
